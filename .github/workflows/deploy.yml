name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run protocol:history
        env:
          PROTOCOL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Install browser for deployment recovery regression
        run: npx playwright install --with-deps chromium
      - name: Check recovery between built app releases
        run: npm run test:recovery

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tintocellar.com
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable.'; exit 1; }
      - run: npm ci
      - run: npm run build
        env:
          BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Snapshot this build's hashed assets
        run: npm run app-release:prepare
      - name: Retain three previous deployments' hashed assets
        run: npm run app-release:retain
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Apply diagnostics migrations
        run: npm run diagnostics:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply gallery migrations and catalog
        run: |
          npm exec -- wrangler d1 migrations apply GALLERY --remote
          npm run gallery:seed -- /tmp/gallery-catalog.sql
          npm exec -- wrangler d1 execute GALLERY --remote --file /tmp/gallery-catalog.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static assets
        run: npm exec -- wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Record a deployment even if a later smoke check fails. This artifact
      # contains only the current build's assets, never the merged generations.
      - name: Save deployed asset generation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/app-release/current/
          if-no-files-found: error
          retention-days: 90
      - name: Check production responses
        env:
          BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://tintocellar.com/labels --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://www.tintocellar.com/labels --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://tintocellar.com/api/health
          # A healthy older Worker can still be missing diagnostic controls.
          # This read requires no secret and must reach the protected route.
          for attempt in 1 2 3 4 5 6; do
            budget_status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' https://tintocellar.com/api/labels/diagnostics/budget) || budget_status=000
            test "$budget_status" = 403 && break
            # A POP can briefly serve the previous version after upload.
            test "$attempt" = 6 || sleep 5
          done
          test "$budget_status" = 403 || { echo "::error::Budget endpoint missing or unprotected (HTTP $budget_status)"; exit 1; }
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 https://tintocellar.com/api/health | jq -e '.status == "ok" and (.capabilities | index("diagnostic-budget-v1") != null and index("curated-intake-v1") != null and index("curated-reconcile-v1") != null)' >/dev/null; then
              capabilities_ready=true
              break
            fi
            test "$attempt" = 6 || sleep 5
          done
          test "${capabilities_ready:-false}" = true || { echo '::error::Combined budget and curated-intake release is not serving'; exit 1; }
          # The beta config route must exist even while collection is disabled.
          # This performs no ingestion and writes no demand counters.
          for public_host in tintocellar.com www.tintocellar.com; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "https://${public_host}/api/analytics/v1/config" | jq -e '.enabled == false' >/dev/null
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "https://${public_host}/api/analytics/v2/config" | jq -e '.version == 2 and .demandEnabled == false and .workflowEnabled == false and .progressEnabled == false' >/dev/null
            version_ready=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --max-time 15 "https://${public_host}/app-version.json" | jq -e --arg expected "$BUILD_ID" '.buildId == $expected' >/dev/null; then
                version_ready=true
                break
              fi
              test "$attempt" = 6 || sleep 5
            done
            test "$version_ready" = true || { echo "::error::Expected app build is not serving on ${public_host}"; exit 1; }
          done
