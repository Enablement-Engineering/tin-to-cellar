name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run protocol:history
        env:
          PROTOCOL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tintocellar.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable.'; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Apply diagnostics migrations
        run: npm run diagnostics:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply gallery migrations and catalog
        run: |
          npm exec -- wrangler d1 migrations apply GALLERY --remote
          npm run gallery:seed -- /tmp/gallery-catalog.sql
          npm exec -- wrangler d1 execute GALLERY --remote --file /tmp/gallery-catalog.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static assets
        run: npm exec -- wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production responses
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://tintocellar.com/labels --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://www.tintocellar.com/labels --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://tintocellar.com/api/health
          # A healthy older Worker can still be missing diagnostic controls.
          # This read requires no secret and must reach the protected route.
          for attempt in 1 2 3 4 5 6; do
            budget_status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' https://tintocellar.com/api/labels/diagnostics/budget) || budget_status=000
            test "$budget_status" = 403 && break
            # A POP can briefly serve the previous version after upload.
            test "$attempt" = 6 || sleep 5
          done
          test "$budget_status" = 403 || { echo "::error::Budget endpoint missing or unprotected (HTTP $budget_status)"; exit 1; }
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 https://tintocellar.com/api/health | jq -e '.status == "ok" and (.capabilities | index("diagnostic-budget-v1") != null and index("curated-intake-v1") != null and index("curated-reconcile-v1") != null)' >/dev/null; then
              capabilities_ready=true
              break
            fi
            test "$attempt" = 6 || sleep 5
          done
          test "${capabilities_ready:-false}" = true || { echo '::error::Combined budget and curated-intake release is not serving'; exit 1; }
          # The beta config route must exist even while collection is disabled.
          # This performs no ingestion and writes no demand counters.
          for public_host in tintocellar.com www.tintocellar.com; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "https://${public_host}/api/analytics/v1/config" | jq -e 'has("enabled") and (.enabled | type == "boolean")' >/dev/null
          done
